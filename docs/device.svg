<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="680" height="330" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- ===== Top view: 24 x 48 mm, GPS half + Atom Lite half ===== -->
  <text x="160" y="40" text-anchor="middle" font-weight="600" fill="#24292f">Top view</text>
  <!-- GPS half -->
  <rect x="30" y="60" width="130" height="130" rx="14" fill="#2b2b2b" stroke="#24292f" stroke-width="2"/>
  <rect x="42" y="72" width="106" height="106" rx="8" fill="#ffffff"/>
  <path d="M95 132 C80 112 78 104 78 98 A17 17 0 0 1 112 98 C112 104 110 112 95 132 Z" fill="#29a8e0"/>
  <circle cx="95" cy="98" r="7" fill="#ffffff"/>
  <circle cx="95" cy="98" r="4.5" fill="#e0204a"/>
  <rect x="42" y="148" width="106" height="30" fill="#2b2b2b"/>
  <text x="95" y="170" text-anchor="middle" font-weight="700" font-size="17" fill="#ffffff">GPS</text>
  <!-- Atom Lite half -->
  <rect x="160" y="60" width="130" height="130" rx="14" fill="#b8bcc0" stroke="#8c959f" stroke-width="2"/>
  <rect x="180" y="80" width="90" height="90" rx="12" fill="#d0d3d6" stroke="#9aa1a8" stroke-width="2"/>
  <circle cx="225" cy="125" r="20" fill="#22d64a" opacity="0.25"/>
  <circle cx="225" cy="125" r="8" fill="#22d64a"/>
  <!-- reset key on the long side, next to the GPS half -->
  <rect x="166" y="188" width="22" height="7" rx="2" fill="#9aa1a8" stroke="#6e7781"/>
  <!-- USB-C end -->
  <rect x="287" y="108" width="6" height="34" rx="2" fill="#24292f"/>
  <text x="300" y="129" fill="#57606a" font-size="12">end view →</text>

  <!-- ===== End view: the USB-C end of the Atom half ===== -->
  <text x="520" y="40" text-anchor="middle" font-weight="600" fill="#24292f">End view</text>
  <rect x="455" y="60" width="130" height="62" rx="10" fill="#b8bcc0" stroke="#8c959f" stroke-width="2"/>
  <rect x="455" y="124" width="130" height="36" rx="8" fill="#a9adb2" stroke="#8c959f" stroke-width="2"/>
  <rect x="503" y="72" width="34" height="12" rx="6" fill="#24292f"/>
  <rect x="505" y="94" width="30" height="16" rx="2" fill="#f2efe6" stroke="#8c959f"/>
  <rect x="480" y="138" width="80" height="6" rx="2" fill="#24292f"/>

  <!-- ===== callouts ===== -->
  <line x1="225" y1="145" x2="235" y2="245" stroke="#57606a"/>
  <text x="200" y="262" fill="#24292f" font-weight="600">Button + status LED</text>
  <text x="200" y="280" fill="#57606a" font-size="12">Button is unused</text>
  <line x1="177" y1="195" x2="90" y2="245" stroke="#57606a"/>
  <text x="30" y="262" fill="#24292f" font-weight="600">Reset button</text>
  <text x="30" y="280" fill="#57606a" font-size="12">On the side</text>
  <line x1="503" y1="78" x2="395" y2="245" stroke="#57606a"/>
  <text x="370" y="262" fill="#24292f" font-weight="600">USB-C</text>
  <text x="370" y="280" fill="#57606a" font-size="12">Power, no switch</text>
  <line x1="520" y1="110" x2="490" y2="245" stroke="#57606a"/>
  <text x="472" y="262" fill="#24292f" font-weight="600">Grove</text>
  <text x="472" y="280" fill="#57606a" font-size="12">Not used</text>
  <line x1="555" y1="144" x2="595" y2="245" stroke="#57606a"/>
  <text x="560" y="262" fill="#24292f" font-weight="600">microSD slot</text>
  <text x="560" y="280" fill="#57606a" font-size="12">Scans + wigle.cfg</text>

  <text x="340" y="316" text-anchor="middle" fill="#8c959f" font-size="11">Illustration, not to scale. Port positions may differ slightly on your unit.</text>
</svg>
